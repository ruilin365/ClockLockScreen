name: release-job

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: windows-latest
    # softprops/action-gh-release 需要写权限才能创建 Release，
    # 新仓库的 GITHUB_TOKEN 默认是只读，必须显式申请
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore .\src\ComputerLock\ComputerLock.csproj

      - name: Publish
        run: dotnet publish .\src\ComputerLock\ComputerLock.csproj -c Release -r win-x64 -p:PublishReadyToRun=true --self-contained false

      - name: Get version
        uses: olegtarasov/get-tag@v2.1.4
        id: tagName

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path ${{github.workspace}}\src\ComputerLock\bin\Release\net8.0-windows\win-x64\publish\* -DestinationPath ${{github.workspace}}\src\ComputerLock\bin\Release\ClockLockScreen_${{ steps.tagName.outputs.tag }}_win_x64.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: ${{github.workspace}}\.github\RELEASE_NOTE.md
          files: ${{github.workspace}}\src\ComputerLock\bin\Release\ClockLockScreen_${{ steps.tagName.outputs.tag }}_win_x64.zip
