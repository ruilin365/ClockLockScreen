name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
    - '**.md'
    - '.github/**'
    - 'resources/**'
    - 'previews/**'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore .\src\ComputerLock\ComputerLock.csproj

      - name: Build
        run: dotnet build .\src\ComputerLock\ComputerLock.csproj -c Release
